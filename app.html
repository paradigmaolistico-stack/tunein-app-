<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PureFrequenze</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #60a5fa;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }

        .layout {
            display: grid;
            gap: 2rem;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .layout {
                grid-template-columns: 400px 1fr;
            }
        }

        .player {
            background: rgba(30, 20, 60, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 2rem;
        }

        .cover {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 20px;
            background: linear-gradient(135deg, #00CED1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 4rem;
        }

        .track-info {
            text-align: center;
            margin-bottom: 2rem;
        }

        .freq-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #00CED1;
            border-radius: 20px;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .track-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .track-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .progress {
            margin: 2rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00CED1, #8b5cf6);
            transition: width 0.1s;
        }

        .time {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-play {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
        }

        .btn svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .btn-play svg {
            width: 36px;
            height: 36px;
            margin-left: 4px;
        }

        .volume {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .volume input {
            width: 100px;
        }

        .content {
            background: rgba(30, 20, 60, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 24px;
            padding: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: #c084fc;
        }

        .freq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 768px) {
            .freq-grid {
                grid-template-columns: 1fr;
            }
        }

        .freq-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .freq-card:active {
            transform: scale(0.98);
        }

        .freq-card.active {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.2);
        }

        .freq-card h3 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .freq-card p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .track-group {
            margin-bottom: 2rem;
        }

        .group-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #c084fc;
        }

        .track-list {
            display: grid;
            gap: 0.5rem;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .track-item:active {
            transform: scale(0.98);
        }

        .track-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
        }

        .track-item h4 {
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }

        .track-item p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .disclaimer {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 2rem;
            text-align: center;
        }

        .disclaimer p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ═══════════════════════════════════════════════════════════════
        // 🎛️ CONFIG - MODIFICA SOLO QUI
        // ═══════════════════════════════════════════════════════════════
        
        const CONFIG = {
            audioBaseUrl: "https://pub-a8b8e92131354b6587fb7d02d880f3e5.r2.dev/purefrequenze"
        };

        const FREQUENCIES = {
            174: { hz: 174, color: "#8B0000", desc: "Radicamento" },
            285: { hz: 285, color: "#FF4500", desc: "Rigenerazione" },
            396: { hz: 396, color: "#FFD700", desc: "Liberazione" },
            417: { hz: 417, color: "#90EE90", desc: "Cambiamento" },
            432: { hz: 432, color: "#4169E1", desc: "Accordatura" },
            528: { hz: 528, color: "#00CED1", desc: "Guarigione" },
            639: { hz: 639, color: "#FF69B4", desc: "Connessione" },
            741: { hz: 741, color: "#9370DB", desc: "Intuizione" },
            852: { hz: 852, color: "#8A2BE2", desc: "Ordine" }
        };

        const TRACKS = {
            peaceful_clouds: {
                name: "Peaceful Clouds",
                tracks: [
                    { id: "floating_free", name: "Floating Free", subtitle: "Soft pads" },
                    { id: "silk_sky", name: "Silk Sky", subtitle: "Gentle textures" },
                    { id: "heavens_rest", name: "Heaven's Rest", subtitle: "Peaceful" },
                    { id: "breeze_dance", name: "Breeze Dance", subtitle: "Light" },
                    { id: "soft_landing", name: "Soft Landing", subtitle: "Gentle" }
                ]
            },
            nature_streams: {
                name: "Nature Streams",
                tracks: [
                    { id: "river_meditation", name: "River Meditation", subtitle: "Water" },
                    { id: "rain_forest", name: "Rain Forest", subtitle: "Ambience" },
                    { id: "earth_breathing", name: "Earth Breathing", subtitle: "Organic" },
                    { id: "wind_pines", name: "Wind Pines", subtitle: "Forest" },
                    { id: "ocean_tides", name: "Ocean Tides", subtitle: "Waves" }
                ]
            },
            gentle_piano: {
                name: "Gentle Piano",
                tracks: [
                    { id: "lullaby_heart", name: "Lullaby Heart", subtitle: "Tender" },
                    { id: "afternoon_tea", name: "Afternoon Tea", subtitle: "Piano" },
                    { id: "letter_to_self", name: "Letter to Self", subtitle: "Keys" },
                    { id: "memory_lane", name: "Memory Lane", subtitle: "Melody" },
                    { id: "hope_blooming", name: "Hope Blooming", subtitle: "Uplifting" }
                ]
            },
            sacred_flute: {
                name: "Sacred Flute",
                tracks: [
                    { id: "temple_garden", name: "Temple Garden", subtitle: "Meditation" },
                    { id: "mountain_breath", name: "Bamboo Flute", subtitle: "Bamboo" },
                    { id: "river_blessing", name: "River Blessing", subtitle: "Water" },
                    { id: "prayer_walk", name: "Prayer Walk", subtitle: "Journey" },
                    { id: "gratitude_song", name: "Gratitude Song", subtitle: "Melody" }
                ]
            },
            crystal_garden: {
                name: "Crystal Garden",
                tracks: [
                    { id: "sunlit_crystals", name: "Sunlit Crystals", subtitle: "Bowls" },
                    { id: "healing_spring", name: "Healing Spring", subtitle: "Harmonics" },
                    { id: "light_prism", name: "Light Prism", subtitle: "Tones" },
                    { id: "gem_harmony", name: "Gem Harmony", subtitle: "Sounds" },
                    { id: "ocean_deep", name: "Ocean Deep", subtitle: "Deep" }
                ]
            }
        };

        const PlayIcon = () => (
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="white" /></svg>
        );

        const PauseIcon = () => (
            <svg viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16" fill="white" />
                <rect x="14" y="4" width="4" height="16" fill="white" />
            </svg>
        );

        const VolumeIcon = () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            </svg>
        );

        const App = () => {
            const [freq, setFreq] = useState(528);
            const [group, setGroup] = useState('peaceful_clouds');
            const [trackIdx, setTrackIdx] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [time, setTime] = useState(0);
            const [duration, setDuration] = useState(300);
            const [volume, setVolume] = useState(0.7);

            const audioRef = useRef(null);

            const currentFreq = FREQUENCIES[freq];
            const currentGroup = TRACKS[group];
            const currentTrack = currentGroup.tracks[trackIdx];

            const getAudioUrl = () => {
                const freqStr = `${freq}hz`;
                const num = String(trackIdx + 1).padStart(2, '0');
                const filename = `${group}_${num}_${currentTrack.id}.mp3`;
                return `${CONFIG.audioBaseUrl}/${freqStr}/${filename}`;
            };

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.src = getAudioUrl();
                    audioRef.current.load();
                    console.log('Audio URL:', getAudioUrl());
                }
            }, [freq, group, trackIdx]);

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                if (playing) {
                    audio.play().catch(err => {
                        console.error('Play error:', err);
                        setPlaying(false);
                    });
                } else {
                    audio.pause();
                }
            }, [playing]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume;
                }
            }, [volume]);

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const onTime = () => setTime(audio.currentTime);
                const onDuration = () => setDuration(audio.duration || 300);

                audio.addEventListener('timeupdate', onTime);
                audio.addEventListener('loadedmetadata', onDuration);

                return () => {
                    audio.removeEventListener('timeupdate', onTime);
                    audio.removeEventListener('loadedmetadata', onDuration);
                };
            }, []);

            const formatTime = (sec) => {
                if (isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const handleFreqClick = (f) => {
                setFreq(f);
                setPlaying(false);
            };

            const handleTrackClick = (g, idx) => {
                setGroup(g);
                setTrackIdx(idx);
                setPlaying(false);
            };

            return (
                <>
                    <audio ref={audioRef} preload="metadata" />
                    
                    <div className="container">
                        <div className="header">
                            <h1 className="logo">PUREFREQUENZE</h1>
                            <p className="tagline">Frequenze Solfeggio</p>
                        </div>

                        <div className="layout">
                            <div className="player">
                                <div className="cover" style={{background: `linear-gradient(135deg, ${currentFreq.color}, #8b5cf6)`}}>
                                    🎵
                                </div>
                                
                                <div className="track-info">
                                    <div className="freq-badge" style={{background: currentFreq.color}}>
                                        {currentFreq.hz} Hz
                                    </div>
                                    <h2 className="track-name">{currentGroup.name}</h2>
                                    <p className="track-subtitle">{currentTrack.name}</p>
                                </div>

                                <div className="progress">
                                    <div className="progress-bar">
                                        <div className="progress-fill" style={{
                                            width: `${(time / duration) * 100}%`,
                                            background: `linear-gradient(90deg, ${currentFreq.color}, #8b5cf6)`
                                        }} />
                                    </div>
                                    <div className="time">
                                        <span>{formatTime(time)}</span>
                                        <span>{formatTime(duration)}</span>
                                    </div>
                                </div>

                                <div className="controls">
                                    <button className="btn btn-play" onClick={() => setPlaying(!playing)}>
                                        {playing ? <PauseIcon /> : <PlayIcon />}
                                    </button>
                                </div>

                                <div className="volume">
                                    <VolumeIcon />
                                    <input type="range" min="0" max="1" step="0.01" value={volume}
                                        onChange={(e) => setVolume(parseFloat(e.target.value))} />
                                </div>
                            </div>

                            <div className="content">
                                <h3 className="section-title">Frequenze Solfeggio</h3>
                                <div className="freq-grid">
                                    {Object.entries(FREQUENCIES).map(([f, data]) => (
                                        <div key={f} 
                                            className={`freq-card ${freq == f ? 'active' : ''}`}
                                            onClick={() => handleFreqClick(parseInt(f))}
                                            style={{borderColor: freq == f ? data.color : 'rgba(139, 92, 246, 0.3)'}}>
                                            <h3 style={{color: data.color}}>{data.hz} Hz</h3>
                                            <p>{data.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <h3 className="section-title">Tracce Musicali</h3>
                                {Object.entries(TRACKS).map(([g, data]) => (
                                    <div key={g} className="track-group">
                                        <div className="group-name">{data.name}</div>
                                        <div className="track-list">
                                            {data.tracks.map((track, idx) => (
                                                <div key={track.id}
                                                    className={`track-item ${group === g && trackIdx === idx ? 'active' : ''}`}
                                                    onClick={() => handleTrackClick(g, idx)}>
                                                    <h4>{track.name}</h4>
                                                    <p>{track.subtitle}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}

                                <div className="disclaimer">
                                    <p>
                                        Le frequenze Solfeggio si basano su tradizioni storiche. 
                                        Gli effetti possono variare e non sostituiscono trattamenti medici.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
