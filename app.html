            theta: { name: "Theta (4-8 Hz)", desc: "Meditazione", freq: 6, carrier: 200 },
            alpha: { name: "Alpha (8-14 Hz)", desc: "Rilassamento", freq: 10, carrier: 200 },
            beta: { name: "Beta (14-30 Hz)", desc: "Concentrazione", freq: 20, carrier: 250 },
            gamma: { name: "Gamma (30-40 Hz)", desc: "Cognizione", freq: 35, carrier: 250 }
        };

        // Icons
        const PlayIcon = () => <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" /></svg>;
        const PauseIcon = () => <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
        const SkipBackIcon = () => <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" /><line x1="5" y1="19" x2="5" y2="5" /></svg>;
        const SkipForwardIcon = () => <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" y1="5" x2="19" y2="19" /></svg>;
        const VolumeIcon = () => <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" /></svg>;

        const App = () => {
            const [selectedFreq, setSelectedFreq] = useState(528);
            const [selectedGroup, setSelectedGroup] = useState('peaceful_clouds');
            const [selectedTrack, setSelectedTrack] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(300);
            const [volume, setVolume] = useState(0.7);
            const [activeTab, setActiveTab] = useState('tracks');
            const [isPremium, setIsPremium] = useState(false);
            const [showUpgradeModal, setShowUpgradeModal] = useState(false);

            const audioRef = useRef(null);
            const currentFreqData = FREQUENCIES[selectedFreq];
            const currentTrackData = TRACK_GROUPS[selectedGroup].tracks[selectedTrack];

            // Check premium status
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        try {
                            const userDoc = await db.collection('users').doc(user.uid).get();
                            if (userDoc.exists) {
                                setIsPremium(userDoc.data().isPremium || false);
                            }
                        } catch (error) {
                            console.error('Errore:', error);
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            const getAudioUrl = () => {
                const freq = `${selectedFreq}hz`;
                const group = selectedGroup;
                const trackNum = String(selectedTrack + 1).padStart(2, '0');
                const track = currentTrackData.id;
                const filename = `${group}_${trackNum}_${track}.mp3`;
                return `${CONFIG.audioBaseUrl}/${freq}/${filename}`;
            };

            useEffect(() => {
                if (audioRef.current) {
                    const url = getAudioUrl();
                    audioRef.current.src = url;
                    audioRef.current.load();
                }
            }, [selectedFreq, selectedGroup, selectedTrack]);

            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume;
                }
            }, [volume]);

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const updateDuration = () => setDuration(audio.duration || 300);

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateDuration);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateDuration);
                };
            }, []);

            const handleFreqSelect = (freq) => {
                if (isPremiumContent('freq', freq) && !isPremium) {
                    setShowUpgradeModal(true);
                    return;
                }
                setSelectedFreq(freq);
                setIsPlaying(false);
                setTimeout(() => setIsPlaying(true), 100);
            };

            const handleTrackSelect = (group, idx) => {
                const track = TRACK_GROUPS[group].tracks[idx];
                if (isPremiumContent('track', track.id) && !isPremium) {
                    setShowUpgradeModal(true);
                    return;
                }
                setSelectedGroup(group);
                setSelectedTrack(idx);
                setIsPlaying(false);
                setTimeout(() => setIsPlaying(true), 100);
            };

            const handleUpgrade = async (plan) => {
                try {
                    if (!auth.currentUser) {
                        await auth.signInAnonymously();
                    }
                    const createCheckout = functions.httpsCallable('createCheckout');
                    const result = await createCheckout({ plan });
                    if (result.data?.url) {
                        window.location.href = result.data.url;
                    }
                } catch (error) {
                    console.error('Errore:', error);
                    alert('Errore checkout: ' + error.message);
                }
            };

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            return (
                <>
                    <audio ref={audioRef} preload="metadata" />
                    <div className="app-container fade-in">
                        <div className="header">
                            <h1 className="logo">PUREFREQUENZE</h1>
                            <p className="tagline">Frequenze Solfeggio per il Benessere</p>
                        </div>

                        <div className="main-layout">
                            <div className="player-column">
                                <div className="player-card">
                                    <div className="cover-art" style={{background: `linear-gradient(135deg, ${currentFreqData.color}, #8b5cf6)`}}>
                                        <svg viewBox="0 0 24 24"><path d={TRACK_GROUPS[selectedGroup].icon} /></svg>
                                    </div>
                                    <div className="track-info">
                                        <div className="freq-badge" style={{background: currentFreqData.color}}>
                                            {currentFreqData.hz} Hz
                                        </div>
                                        <h2 className="track-name">{TRACK_GROUPS[selectedGroup].name}</h2>
                                        <p className="track-subtitle">{currentTrackData.name}</p>
                                    </div>
                                    <div className="progress-container">
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{
                                                width: `${(currentTime / duration) * 100}%`,
                                                background: `linear-gradient(90deg, ${currentFreqData.color}, #8b5cf6)`
                                            }} />
                                        </div>
                                        <div className="time-info">
                                            <span>{formatTime(currentTime)}</span>
                                            <span>{formatTime(duration)}</span>
                                        </div>
                                    </div>
                                    <div className="player-controls">
                                        <button className="control-btn"><SkipBackIcon /></button>
                                        <button className="control-btn play" onClick={() => setIsPlaying(!isPlaying)}>
                                            {isPlaying ? <PauseIcon /> : <PlayIcon />}
                                        </button>
                                        <button className="control-btn"><SkipForwardIcon /></button>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'center', gap: '1rem', marginTop: '1rem'}}>
                                        <button className="control-btn"><VolumeIcon /></button>
                                        <input type="range" min="0" max="1" step="0.01" value={volume} 
                                            onChange={(e) => setVolume(parseFloat(e.target.value))}
                                            style={{width: '100px'}} />
                                    </div>
                                </div>
                            </div>

                            <div className="tabs-column">
                                <div className="tabs-header">
                                    <button className={`tab-button ${activeTab === 'tracks' ? 'active' : ''}`} 
                                        onClick={() => setActiveTab('tracks')}>Tracce & Frequenze</button>
                                </div>
                                <div className="tab-content">
                                    <h3 style={{fontSize: '1.6rem', marginBottom: '1.5rem'}}>Frequenze Solfeggio:</h3>
                                    <div className="freq-grid">
                                        {Object.entries(FREQUENCIES).map(([freq, data]) => (
                                            <div key={freq} className={`freq-item ${selectedFreq == freq ? 'active' : ''}`}
                                                style={{'--freq-color': data.color}}
                                                onClick={() => handleFreqSelect(parseInt(freq))}>
                                                <h3>{data.hz} Hz</h3>
                                                <p>{data.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <h3 style={{fontSize: '1.6rem', margin: '3rem 0 1.5rem'}}>Tracce Musicali:</h3>
                                    <div className="track-groups">
                                        {Object.entries(TRACK_GROUPS).map(([groupId, group]) => (
                                            <div key={groupId} className="track-group">
                                                <h3 style={{marginBottom: '1rem'}}>{group.name}</h3>
                                                {group.tracks.map((track, idx) => (
                                                    <div key={track.id} 
                                                        className={`track-item ${selectedGroup === groupId && selectedTrack === idx ? 'active' : ''}`}
                                                        onClick={() => handleTrackSelect(groupId, idx)}>
                                                        <h4>{track.name}</h4>
                                                        <p style={{fontSize: '0.9rem', color: 'rgba(255,255,255,0.5)'}}>{track.subtitle}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style={{marginTop: '3rem', padding: '2rem', background: 'rgba(59, 130, 246, 0.1)', 
                            border: '1px solid rgba(59, 130, 246, 0.3)', borderRadius: '16px', textAlign: 'center'}}>
                            <p style={{color: 'rgba(255,255,255,0.7)', fontSize: '0.9rem', lineHeight: '1.6'}}>
                                Le frequenze Solfeggio si basano su tradizioni storiche. Gli effetti possono variare 
                                e non sostituiscono trattamenti medici professionali.
                            </p>
                        </div>
                    </div>

                    {showUpgradeModal && (
                        <div className="modal-overlay" onClick={() => setShowUpgradeModal(false)}>
                            <div className="upgrade-modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setShowUpgradeModal(false)}>×</button>
                                <h2 style={{textAlign: 'center', marginBottom: '2rem'}}>Sblocca Premium</h2>
                                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '1rem', marginBottom: '2rem'}}>
                                    <div style={{padding: '1.5rem', background: 'rgba(139,92,246,0.1)', borderRadius: '12px', cursor: 'pointer'}}
                                        onClick={() => handleUpgrade('monthly')}>
                                        <h3 style={{marginBottom: '0.5rem'}}>Mensile</h3>
                                        <div style={{fontSize: '2rem', fontWeight: '700'}}>€{CONFIG.prezzi.mensile}</div>
                                        <div style={{fontSize: '0.9rem', opacity: 0.7}}>/mese</div>
                                    </div>
                                    <div style={{padding: '1.5rem', background: 'rgba(139,92,246,0.1)', borderRadius: '12px', cursor: 'pointer'}}
                                        onClick={() => handleUpgrade('annual')}>
                                        <h3 style={{marginBottom: '0.5rem'}}>Annuale</h3>
                                        <div style={{fontSize: '2rem', fontWeight: '700'}}>€{CONFIG.prezzi.annuale}</div>
                                        <div style={{fontSize: '0.9rem', opacity: 0.7}}>/anno</div>
                                    </div>
                                    <div style={{padding: '1.5rem', background: 'rgba(139,92,246,0.1)', borderRadius: '12px', cursor: 'pointer'}}
                                        onClick={() => handleUpgrade('lifetime')}>
                                        <h3 style={{marginBottom: '0.5rem'}}>Lifetime</h3>
                                        <div style={{fontSize: '2rem', fontWeight: '700'}}>€{CONFIG.prezzi.lifetime}</div>
                                        <div style={{fontSize: '0.9rem', opacity: 0.7}}>una tantum</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
