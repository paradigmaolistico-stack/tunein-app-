<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PureFrequenze - Ritrova equilibrio con frequenze Solfeggio e battimenti binaurali.">
    <title>PureFrequenze — Frequenze Solfeggio & Battimenti Binaurali</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase 10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

<style>
/* ============================================================
   VARIABILI — Modifica qui colori e dimensioni globali
   ============================================================ */
:root {
    /* Brand */
    --bg-deep:    #07091a;
    --bg-mid:     #0d1230;
    --bg-card:    rgba(20, 15, 45, 0.6);
    --bg-item:    rgba(30, 20, 55, 0.4);

    /* Accenti */
    --accent:     #8b5cf6;
    --accent-dim: rgba(139, 92, 246, 0.25);
    --accent-soft:#c084fc;

    /* Testo */
    --text-hi:    #ffffff;
    --text-mid:   rgba(255,255,255,0.7);
    --text-lo:    rgba(255,255,255,0.45);

    /* Bordi */
    --border:     rgba(139, 92, 246, 0.2);
    --border-hi:  rgba(139, 92, 246, 0.5);

    /* Frequenze — colori individuali */
    --c174: #8B0000;
    --c285: #FF4500;
    --c396: #FFD700;
    --c417: #90EE90;
    --c432: #4169E1;
    --c528: #00CED1;
    --c639: #FF69B4;
    --c741: #9370DB;
    --c852: #8A2BE2;

    /* Raggi e spazi */
    --r-sm: 12px;
    --r-md: 18px;
    --r-lg: 28px;
    --r-xl: 32px;

    /* Transizioni */
    --t-fast: 0.2s ease;
    --t-mid:  0.35s cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   RESET E BASE
   ============================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
    color: var(--text-hi);
    min-height: 100vh;
    overflow-x: hidden;
}

body.modal-open { overflow:hidden; position:fixed; width:100%; }

/* ============================================================
   SFONDO — Orbs animati
   ============================================================ */
.bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; }
.orb {
    position:absolute; border-radius:50%;
    filter:blur(100px); opacity:0.13;
    animation: float 25s infinite ease-in-out;
}
.orb-1 { width:600px;height:600px; background:radial-gradient(circle,#1e3a8a,transparent); top:-100px; left:-100px; }
.orb-2 { width:700px;height:700px; background:radial-gradient(circle,#7c3aed,transparent); bottom:-150px; right:-150px; animation-delay:8s; }
.orb-3 { width:500px;height:500px; background:radial-gradient(circle,#0891b2,transparent); top:40%; left:40%; animation-delay:15s; }
@keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    33%      { transform:translate(80px,-120px) scale(1.2); }
    66%      { transform:translate(-60px,100px) scale(.9); }
}

/* ============================================================
   LAYOUT PRINCIPALE
   ============================================================ */
.app-wrap {
    max-width: 1800px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
    position: relative;
    z-index: 1;
}

/* ============================================================
   HEADER / HERO
   ============================================================ */
.header {
    text-align: center;
    padding: 3rem 1rem 2rem;
}

.logo {
    font-family: 'Cinzel', serif;
    font-size: clamp(42px, 8vw, 90px);
    font-weight: 700;
    letter-spacing: 10px;
    color: #fff;
    filter:
        drop-shadow(0 0 50px rgba(139,92,246,.7))
        drop-shadow(0 0 25px rgba(59,130,246,.5));
    animation: logo-pulse 4s ease-in-out infinite;
}
@keyframes logo-pulse {
    0%,100% { filter: drop-shadow(0 0 50px rgba(139,92,246,.7)) drop-shadow(0 0 25px rgba(59,130,246,.5)); }
    50%      { filter: drop-shadow(0 0 70px rgba(139,92,246,.9)) drop-shadow(0 0 40px rgba(59,130,246,.7)); }
}

.tagline {
    margin-top: 1rem;
    font-size: clamp(13px, 2vw, 16px);
    color: #60a5fa;
    letter-spacing: 4px;
    font-weight: 300;
    text-transform: uppercase;
}

.hero-meta {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    margin: 1.8rem 0 2.5rem;
}
.hero-chip {
    padding: .5rem 1.2rem;
    background: var(--accent-dim);
    border: 1px solid var(--border);
    border-radius: 30px;
    font-size: .85rem;
    color: var(--accent-soft);
    font-weight: 500;
}

/* ============================================================
   GRID PRINCIPALE (Player | Tabs)
   ============================================================ */
.main-grid {
    display: grid;
    grid-template-columns: 480px 1fr;
    gap: 2.5rem;
    align-items: start;
}
@media (max-width:1100px) { .main-grid { grid-template-columns: 1fr; } }

/* ============================================================
   CARD GENERICA
   ============================================================ */
.card {
    background: var(--bg-card);
    backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 2rem;
    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 10px 40px rgba(139,92,246,.2),
        inset 0 1px 0 rgba(255,255,255,.08);
}

/* ============================================================
   PLAYER
   ============================================================ */
.cover-art {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, var(--c528), #8b5cf6);
    display: flex; align-items:center; justify-content:center;
    margin-bottom: 2rem;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,206,209,.35), 0 10px 30px rgba(139,92,246,.25);
}
.cover-art svg { width:45%; height:45%; stroke:white; fill:none; stroke-width:2; opacity:.9; }
.cover-art::after {
    content:''; position:absolute; top:-50%; left:-50%;
    width:200%; height:200%;
    background: linear-gradient(45deg,transparent,rgba(255,255,255,.12),transparent);
    transform:rotate(45deg);
    animation: shimmer 5s infinite;
}
@keyframes shimmer {
    0%  { transform:translateX(-100%) translateY(-100%) rotate(45deg); }
    100%{ transform:translateX(100%)  translateY(100%)  rotate(45deg); }
}

.track-info { text-align:center; margin-bottom:2rem; }

.freq-badge {
    display:inline-block;
    padding:.6rem 1.8rem;
    background: var(--c528);
    border-radius:30px;
    font-size:1rem; font-weight:700;
    margin-bottom:1rem;
    box-shadow: 0 6px 20px rgba(0,206,209,.45);
}

.track-name    { font-size:clamp(1.5rem,3vw,2.2rem); font-weight:700; margin-bottom:.4rem; }
.track-sub     { color:var(--text-mid); font-size:1.05rem; }
.mode-badge    { display:inline-block; margin-top:.8rem; padding:.4rem 1.2rem; background:var(--accent-dim); border:1px solid var(--border-hi); border-radius:20px; font-size:.85rem; color:var(--accent-soft); }

/* Progress */
.progress-wrap { margin:2rem 0; }
.progress-bar {
    width:100%; height:12px;
    background:rgba(255,255,255,.07);
    border-radius:10px; cursor:pointer;
    position:relative; overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.3);
}
.progress-fill {
    height:100%;
    background: linear-gradient(90deg, var(--c528), #8b5cf6);
    border-radius:10px;
    transition: width .1s linear;
    box-shadow: 0 0 20px rgba(0,206,209,.5);
    position:relative;
}
.progress-fill::after {
    content:''; position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:18px; height:18px; background:#fff; border-radius:50%;
    box-shadow:0 2px 8px rgba(0,0,0,.4), 0 0 12px rgba(255,255,255,.4);
}
.time-row { display:flex; justify-content:space-between; margin-top:1rem; color:var(--text-lo); font-size:.95rem; }

/* Controls */
.controls-main { display:flex; justify-content:center; align-items:center; gap:2.5rem; margin:2rem 0; }
.controls-sec  { display:flex; justify-content:center; align-items:center; gap:1.5rem; }

.btn-ctrl {
    background:none; border:none; color:var(--text-hi);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:var(--t-mid);
}
.btn-ctrl svg { width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2; }
.btn-ctrl:hover { transform:scale(1.15) translateY(-2px); filter:drop-shadow(0 6px 16px rgba(139,92,246,.6)); }
.btn-ctrl.active { color:var(--accent); }

.btn-play {
    width:86px; height:86px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    border-radius:50%;
    box-shadow:0 15px 40px rgba(139,92,246,.55);
}
.btn-play svg { width:38px; height:38px; fill:white; stroke:none; margin-left:4px; }
.btn-play:hover { box-shadow:0 20px 50px rgba(139,92,246,.8); transform:scale(1.08) translateY(-3px); }

/* Volume */
.volume-row { display:flex; align-items:center; gap:.6rem; }
.vol-slider {
    width:90px; height:6px; border-radius:3px;
    background:rgba(255,255,255,.1); outline:none; -webkit-appearance:none; cursor:pointer;
}
.vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:var(--accent); cursor:pointer;
    box-shadow:0 0 10px rgba(139,92,246,.5);
}

/* ============================================================
   TABS
   ============================================================ */
.tabs-nav {
    display:flex; gap:.5rem; flex-wrap:wrap;
    margin-bottom:2rem;
    border-bottom: 1px solid rgba(255,255,255,.07);
    padding-bottom:.5rem;
}
.tab-btn {
    background:none; border:none; font-family:inherit;
    color:var(--text-lo); padding:1rem 2rem;
    font-size:1rem; font-weight:600; cursor:pointer;
    transition:var(--t-fast); position:relative;
}
.tab-btn::after {
    content:''; position:absolute; bottom:-8px; left:0; right:0; height:3px;
    background:linear-gradient(90deg,#8b5cf6,#6366f1);
    transform:scaleX(0); transition:var(--t-fast); border-radius:3px 3px 0 0;
}
.tab-btn:hover  { color:rgba(255,255,255,.8); }
.tab-btn.active { color:var(--accent-soft); }
.tab-btn.active::after { transform:scaleX(1); }

.tab-pane {
    background: linear-gradient(135deg, rgba(30,20,60,.5), rgba(20,15,45,.4));
    backdrop-filter:blur(30px);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:2.5rem;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

/* ============================================================
   FREQUENZE GRID
   ============================================================ */
.freq-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:1.2rem;
    margin-bottom:2.5rem;
}

.freq-item {
    background:var(--bg-item);
    border:2px solid transparent;
    border-radius:var(--r-md);
    padding:1.8rem;
    cursor:pointer;
    transition:var(--t-mid);
    position:relative; overflow:hidden;
}
.freq-item::before {
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--fc,#8b5cf6);
    transform:scaleX(0); transition:var(--t-mid);
}
.freq-item:hover::before  { transform:scaleX(1); }
.freq-item:hover {
    background:rgba(40,30,65,.6);
    border-color:var(--fc,#8b5cf6);
    transform:translateY(-5px);
    box-shadow:0 12px 35px rgba(var(--fc-rgb,139,92,246),.35);
}
.freq-item.active {
    border-color:var(--fc,#8b5cf6);
    box-shadow:0 12px 35px rgba(var(--fc-rgb,139,92,246),.45);
}
.freq-item h3 { font-size:2rem; color:var(--fc,#8b5cf6); margin-bottom:.5rem; font-weight:700; }
.freq-item p  { color:var(--text-mid); font-size:.92rem; line-height:1.5; }

/* ============================================================
   TRACCE
   ============================================================ */
.track-groups { display:grid; gap:1.8rem; }

.track-group {
    background:var(--bg-item);
    border-radius:var(--r-md);
    padding:1.8rem;
    border:1px solid rgba(255,255,255,.07);
}
.tg-header {
    display:flex; align-items:center; gap:1.2rem;
    margin-bottom:1.2rem; padding-bottom:1.2rem;
    border-bottom:1px solid rgba(255,255,255,.07);
}
.tg-icon { width:40px; height:40px; stroke:#8b5cf6; fill:none; stroke-width:2; }
.tg-header h3 { font-size:1.4rem; font-weight:700; }

.track-list { display:grid; gap:.8rem; }
.track-item {
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    border-radius:var(--r-sm);
    padding:1rem 1.2rem;
    cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:var(--t-mid); position:relative; overflow:hidden;
}
.track-item::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,#8b5cf6,#6366f1);
    transform:scaleY(0); transition:var(--t-mid);
}
.track-item:hover::before { transform:scaleY(1); }
.track-item:hover  { background:rgba(255,255,255,.07); border-color:var(--accent-dim); transform:translateX(6px); }
.track-item.active { background:linear-gradient(90deg,rgba(139,92,246,.2),rgba(99,102,241,.12)); border-color:rgba(139,92,246,.4); }
.track-item h4 { font-size:1rem; margin-bottom:.3rem; }
.track-item p  { font-size:.875rem; color:var(--text-lo); }

/* ============================================================
   APPLICAZIONI
   ============================================================ */
.app-grid { display:grid; gap:1.8rem; }
.app-card {
    background:var(--bg-item);
    border-radius:var(--r-md);
    padding:1.8rem;
    border:1px solid rgba(255,255,255,.07);
}
.app-head {
    display:flex; align-items:center; gap:1.2rem;
    margin-bottom:1.2rem; padding-bottom:1.2rem;
    border-bottom:1px solid rgba(255,255,255,.07);
}
.app-icon { width:40px; height:40px; stroke:#8b5cf6; fill:none; stroke-width:2; }
.app-head h3  { font-size:1.4rem; font-weight:700; }
.app-sub      { color:var(--text-lo); font-size:.9rem; margin-top:.3rem; }

.obj-list { display:grid; gap:.8rem; }
.obj-item {
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    border-radius:var(--r-sm);
    padding:1rem 1.2rem;
    display:flex; gap:1rem; align-items:flex-start;
}
.obj-item h4 { font-size:.95rem; margin-bottom:.5rem; }

.freq-tags { display:flex; flex-wrap:wrap; gap:.5rem; }
.freq-tag {
    padding:.35rem .9rem;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.3);
    border-radius:10px; font-size:.82rem; color:var(--accent-soft);
    cursor:pointer; transition:var(--t-fast); font-family:inherit;
}
.freq-tag:hover { background:rgba(139,92,246,.22); transform:translateY(-2px); }
.freq-tag.binaural { background:rgba(124,58,237,.12); border-color:rgba(124,58,237,.35); color:#c4b5fd; }

/* ============================================================
   BINAURALE
   ============================================================ */
.binaural-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.5rem; margin-top:1.5rem; }
.binaural-card {
    background:linear-gradient(135deg,rgba(30,20,60,.5),rgba(20,15,45,.4));
    border:2px solid var(--border);
    border-radius:24px; padding:2rem;
    cursor:pointer; transition:var(--t-mid); position:relative; overflow:hidden;
}
.binaural-card::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at top,rgba(139,92,246,.12),transparent);
    opacity:0; transition:var(--t-mid);
}
.binaural-card:hover::before { opacity:1; }
.binaural-card:hover  { border-color:var(--accent); transform:translateY(-6px); box-shadow:0 18px 45px rgba(139,92,246,.35); }
.binaural-card.active { border-color:var(--accent); background:linear-gradient(135deg,rgba(40,30,70,.7),rgba(30,20,55,.6)); }
.binaural-card h3 { font-size:1.6rem; color:var(--accent-soft); margin-bottom:.8rem; }
.binaural-card p  { color:var(--text-mid); line-height:1.7; margin-bottom:1.2rem; font-size:.95rem; }

.binaural-feats { list-style:none; }
.binaural-feats li { padding:.6rem 0 .6rem 1.8rem; position:relative; color:var(--text-mid); font-size:.92rem; }
.binaural-feats li::before { content:'✓'; position:absolute; left:0; color:var(--accent); font-weight:700; }

.range-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem; margin-top:1.5rem; }
.range-btn {
    background:rgba(139,92,246,.08); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:1rem .8rem; text-align:center;
    cursor:pointer; transition:var(--t-mid); font-family:inherit; color:var(--text-hi);
}
.range-btn:hover   { background:rgba(139,92,246,.15); transform:translateY(-2px); }
.range-btn.active  { background:rgba(139,92,246,.3); border-color:var(--accent); }
.range-btn .rb-name { font-weight:700; font-size:.95rem; margin-bottom:.35rem; }
.range-btn .rb-desc { font-size:.8rem; color:var(--text-lo); }

/* ============================================================
   LOCKS (Premium)
   ============================================================ */
.lock-badge {
    position:absolute; top:.8rem; right:.8rem;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(139,92,246,.18); border:1px solid rgba(139,92,246,.35);
    border-radius:50%; z-index:5; pointer-events:none;
}
.lock-badge svg { width:12px; height:12px; stroke:var(--accent-soft); fill:none; stroke-width:2.5; }

.locked { cursor:pointer !important; position:relative; }
.locked::after {
    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,.25); backdrop-filter:blur(.8px);
    border-radius:inherit; opacity:0; transition:opacity var(--t-fast); pointer-events:none;
}
.locked:hover::after { opacity:1; }

/* ============================================================
   MODALI
   ============================================================ */
.modal-bg {
    position:fixed; inset:0;
    background:rgba(0,0,0,.85); backdrop-filter:blur(12px);
    display:flex; align-items:flex-start; justify-content:center;
    z-index:2000; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:2rem 1rem;
    animation: fade-in .25s ease;
}
@keyframes fade-in { from{opacity:0} to{opacity:1} }
@keyframes slide-up { from{transform:translateY(28px);opacity:0} to{transform:translateY(0);opacity:1} }

.modal-box {
    background:linear-gradient(135deg,rgba(28,18,50,.97),rgba(18,12,35,.97));
    border:1px solid rgba(139,92,246,.35);
    border-radius:var(--r-xl); padding:2.5rem;
    position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.85);
    animation: slide-up .35s ease;
}
.modal-close {
    position:absolute; top:1.2rem; right:1.2rem;
    width:34px; height:34px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    border-radius:50%; cursor:pointer; font-size:1.3rem;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-hi); transition:var(--t-fast);
}
.modal-close:hover { background:rgba(255,255,255,.15); transform:rotate(90deg); }

/* Upgrade Modal */
.upgrade-modal { max-width:620px; width:100%; }

.upgrade-head { text-align:center; margin-bottom:2rem; }
.upgrade-head .eyebrow {
    font-size:.8rem; text-transform:uppercase; letter-spacing:2px;
    color:var(--accent); font-weight:600; margin-bottom:.8rem;
}
.upgrade-head h2 {
    font-size:1.9rem; font-weight:700;
    background:linear-gradient(135deg,#c084fc,#60a5fa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; margin-bottom:.8rem;
}

                    ['Playlist Personalizzate', 'Salva e richiama le tue combinazioni preferite']
                ].map(([h,p]) => (
                    <div key={h} className="upgrade-feat">
                        <Icon.Check />
                        <div><h4>{h}</h4><p>{p}</p></div>
                    </div>
                ))}
            </div>
            <div className="pricing-grid">
                {Object.entries(STRIPE_PLANS).map(([key, plan]) => (
                    <div key={key} className="plan-card" onClick={() => onUpgrade(key)}>
                        <h4>{plan.label}</h4>
                        <div className="price">{plan.price}</div>
                        <div className="period">{plan.period}</div>
                        {plan.save && <div className="save">{plan.save}</div>}
                    </div>
                ))}
            </div>
            <button className="btn-upgrade" onClick={() => onUpgrade('monthly')}>
                Sblocca Tutto Ora
            </button>
            <p className="modal-footnote">Pagamento sicuro · Cancella quando vuoi · Garanzia 30 giorni</p>
        </div>
    </div>
);

/* ── Modal Timer ── */
const TimerModal = ({ sleepTimer, isPremium, onSet, onClose }) => (
    <div className="modal-bg" onClick={onClose}>
        <div className="modal-box timer-modal" onClick={e => e.stopPropagation()} style={{position:'relative'}}>
            <button className="modal-close" onClick={onClose}>×</button>
            <h3 style={{fontSize:'1.4rem', marginBottom:'.4rem'}}>Sleep Timer</h3>
            <p style={{color:'var(--text-lo)', fontSize:'.9rem'}}>L'audio si fermerà automaticamente</p>
            <div className="timer-grid">
                {[[15,!isPremium],[30,false],[45,!isPremium],[60,false],[90,!isPremium]].map(([min, locked]) => (
                    <button key={min} className={`timer-opt ${sleepTimer===min?'active':''}`} onClick={() => onSet(min, locked)}>
                        {locked && '🔒 '}{min} min
                    </button>
                ))}
                <button className="timer-opt" onClick={() => onSet(null, false)}>Off</button>
            </div>
            {sleepTimer && <p style={{marginTop:'1rem',color:'var(--accent)',textAlign:'center',fontSize:'.9rem'}}>Attivo: {sleepTimer} min</p>}
        </div>
    </div>
);

/* ==============================================================
   SEZIONE 5 — APP PRINCIPALE
   ============================================================== */
const App = () => {

    /* ── State ── */
    const [selFreq,      setSelFreq]      = useState(528);
    const [selGroup,     setSelGroup]     = useState('nuvole_serene');
    const [selTrack,     setSelTrack]     = useState(0);
    const [playing,      setPlaying]      = useState(false);
    const [curTime,      setCurTime]      = useState(0);
    const [duration,     setDuration]     = useState(300);
    const [volume,       setVolume]       = useState(0.7);
    const [activeTab,    setActiveTab]    = useState('tracks');
    const [binMode,      setBinMode]      = useState(null);    // null | 'pure' | 'hybrid'
    const [binRange,     setBinRange]     = useState('theta');
    const [shuffle,      setShuffle]      = useState(false);
    const [repeat,       setRepeat]       = useState(false);
    const [sleepTimer,   setSleepTimer]   = useState(null);
    const [isPremium,    setIsPremium]    = useState(false);
    const [showUpgrade,  setShowUpgrade]  = useState(false);
    const [showTimer,    setShowTimer]    = useState(false);

    /* ── Refs ── */
    const audioRef   = useRef(null);
    const ctxRef     = useRef(null);
    const oscLRef    = useRef(null);
    const oscRRef    = useRef(null);
    const gainRef    = useRef(null);
    const timerRef   = useRef(null);

    /* ── Dati correnti ── */
    const freqData  = FREQUENCIES[selFreq];
    const groupData = TRACK_GROUPS[selGroup];
    const trackData = groupData.tracks[selTrack];

    // ── Refs "always-current" per evitare stale closures ─────────
    const playingRef  = useRef(false);
    const binModeRef  = useRef(null);
    const binRangeRef = useRef('theta');
    useEffect(() => { playingRef.current  = playing;  }, [playing]);
    useEffect(() => { binModeRef.current  = binMode;  }, [binMode]);
    useEffect(() => { binRangeRef.current = binRange; }, [binRange]);

    // ── Unlock AudioContext alla prima gesture (iOS/Android) ──────
    useEffect(() => {
        const unlock = () => {
            if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();
        };
        document.addEventListener('touchstart', unlock, { once: true });
        document.addEventListener('click',      unlock, { once: true });
        return () => {
            document.removeEventListener('touchstart', unlock);
            document.removeEventListener('click',      unlock);
        };
    }, []);

    // ── Firebase: check premium ──────────────────────────────────
    useEffect(() => {
        const unsub = auth.onAuthStateChanged(async user => {
            if (!user) { setIsPremium(false); return; }
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                setIsPremium(doc.exists && !!doc.data().isPremium);
            } catch { setIsPremium(false); }
        });
        return unsub;
    }, []);

    // ── Init Web Audio Context ───────────────────────────────────
    useEffect(() => {
        if (!ctxRef.current)
            ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }, []);

    // ── URL Audio da R2 ──────────────────────────────────────────
    const getAudioUrl = useCallback(() => {
        const num  = String(selTrack + 1).padStart(2,'0');
        const file = `${selGroup}_${num}_${trackData.id}.mp3`;
        return `${AUDIO_BASE}/${selFreq}hz/${file}`;
    }, [selFreq, selGroup, selTrack, trackData]);

    // ── Binaural: start / stop ───────────────────────────────────
    const stopBinaural = useCallback(() => {
        [oscLRef, oscRRef].forEach(r => {
            if (!r.current) return;
            try { r.current.stop(); r.current.disconnect(); } catch {}
            r.current = null;
        });
        if (gainRef.current) {
            try { gainRef.current.disconnect(); } catch {}
            gainRef.current = null;
        }
    }, []);

    const startBinaural = useCallback(() => {
        stopBinaural();
        const ctx = ctxRef.current;
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();

        const range = BINAURAL_RANGES[binRangeRef.current];
        const gain  = ctx.createGain();
        gain.gain.value = volume * 0.3;

        const panL = ctx.createStereoPanner();
        const panR = ctx.createStereoPanner();
        panL.pan.value = -1; panR.pan.value = 1;

        const oscL = ctx.createOscillator();
        const oscR = ctx.createOscillator();
        oscL.frequency.value = range.carrier;
        oscR.frequency.value = range.carrier + range.freq;
        oscL.type = oscR.type = 'sine';

        oscL.connect(panL).connect(gain).connect(ctx.destination);
        oscR.connect(panR).connect(gain).connect(ctx.destination);
        oscL.start(); oscR.start();

        oscLRef.current = oscL; oscRRef.current = oscR; gainRef.current = gain;
    }, [volume, stopBinaural]);

    // ── playAudio: aspetta canplaythrough su mobile ───────────────
    const playAudio = useCallback(() => {
        const audio = audioRef.current;
        if (!audio || binModeRef.current === 'pure') return;
        if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();

        const tryPlay = () =>
            audio.play().catch(err => {
                if (err.name === 'NotAllowedError') setPlaying(false);
            });

        if (audio.readyState >= 3) {
            tryPlay();
        } else {
            const onReady = () => {
                audio.removeEventListener('canplaythrough', onReady);
                if (playingRef.current) tryPlay();
            };
            audio.addEventListener('canplaythrough', onReady);
        }
    }, []);

    // ── Carica + riparti automatico al cambio freq/traccia ───────
    useEffect(() => {
        const audio = audioRef.current;
        if (!audio || binModeRef.current === 'pure') return;
        audio.src = getAudioUrl();
        audio.load();
        if (playingRef.current) {
            const onReady = () => {
                audio.removeEventListener('canplaythrough', onReady);
                if (playingRef.current) {
                    if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();
                    audio.play().catch(()=>{});
                }
            };
            audio.addEventListener('canplaythrough', onReady);
        }
    }, [selFreq, selGroup, selTrack]);

    // ── Play / Pause ─────────────────────────────────────────────
    useEffect(() => {
        if (playing) {
            if (binModeRef.current) startBinaural();
            playAudio();
        } else {
            stopBinaural();
            audioRef.current?.pause();
        }
    }, [playing]);

    // ── Cambio binMode ───────────────────────────────────────────
    useEffect(() => {
        if (!playing) return;
        stopBinaural();
        if (binMode) startBinaural();
        if (binMode !== 'pure') playAudio();
    }, [binMode]);

    // ── Cambio binRange durante play ─────────────────────────────
    useEffect(() => {
        if (playing && binMode) {
            stopBinaural();
            setTimeout(startBinaural, 80);
        }
    }, [binRange]);

    // ── Volume ───────────────────────────────────────────────────
    useEffect(() => {
        if (audioRef.current)  audioRef.current.volume = volume;
        if (gainRef.current)   gainRef.current.gain.value = volume * 0.3;
    }, [volume]);

    // ── Audio events ─────────────────────────────────────────────
    useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;
        const onTime = () => setCurTime(audio.currentTime);
        const onMeta = () => setDuration(audio.duration || 300);
        const onEnd  = () => {
            if (repeat) { audio.currentTime = 0; audio.play().catch(()=>{}); }
            else nextTrack();
        };
        audio.addEventListener('timeupdate',    onTime);
        audio.addEventListener('loadedmetadata',onMeta);
        audio.addEventListener('ended',         onEnd);
        return () => {
            audio.removeEventListener('timeupdate',    onTime);
            audio.removeEventListener('loadedmetadata',onMeta);
            audio.removeEventListener('ended',         onEnd);
        };
    }, [repeat, nextTrack]);

    // ── Sleep Timer ──────────────────────────────────────────────
    useEffect(() => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (sleepTimer)
            timerRef.current = setTimeout(() => { setPlaying(false); setSleepTimer(null); }, sleepTimer * 60000);
        return () => clearTimeout(timerRef.current);
    }, [sleepTimer]);

    // ── Visibility: resume dopo lock screen / chiamata / Siri ─────
    useEffect(() => {
        const onVis = () => {
            if (document.hidden || !playingRef.current) return;
            setTimeout(() => {
                if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();
                if (binModeRef.current) startBinaural();
                if (binModeRef.current !== 'pure' && audioRef.current)
                    audioRef.current.play().catch(()=>{});
            }, 400);
        };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
    }, [startBinaural]);

    // ── Modal: blocca scroll ─────────────────────────────────────
    useEffect(() => {
        document.body.classList.toggle('modal-open', showUpgrade || showTimer);
        return () => document.body.classList.remove('modal-open');
    }, [showUpgrade, showTimer]);

    /* ── Handlers navigazione ── */
    const nextTrack = useCallback(() => {
        if (shuffle) {
            const keys  = Object.keys(TRACK_GROUPS);
            const gKey  = keys[Math.floor(Math.random() * keys.length)];
            const avail = TRACK_GROUPS[gKey].tracks
                .map((t,i)=>({t,i}))
                .filter(({t}) => t.free || isPremium);
            if (!avail.length) return;
            const pick = avail[Math.floor(Math.random() * avail.length)];
            setSelGroup(gKey); setSelTrack(pick.i);
        } else {
            const tracks = groupData.tracks;
            let next = (selTrack + 1) % tracks.length;
            let tries = 0;
            while (!tracks[next].free && !isPremium && tries++ < tracks.length)
                next = (next + 1) % tracks.length;
            if (next === 0) {
                const keys = Object.keys(TRACK_GROUPS);
                setSelGroup(keys[(keys.indexOf(selGroup) + 1) % keys.length]);
            }
            setSelTrack(next);
        }
    }, [shuffle, selTrack, selGroup, groupData, isPremium]);

    const prevTrack = useCallback(() => {
        if (selTrack > 0) { setSelTrack(s => s - 1); return; }
        const keys = Object.keys(TRACK_GROUPS);
        const prev = keys[(keys.indexOf(selGroup) - 1 + keys.length) % keys.length];
        setSelGroup(prev);
        setSelTrack(TRACK_GROUPS[prev].tracks.length - 1);
    }, [selTrack, selGroup]);

    /* ── Handlers selezione ── */
    const selectFreq = (hz) => {
        if (FREQUENCIES[hz].premium && !isPremium) { setShowUpgrade(true); return; }
        setSelFreq(hz);
        setBinMode(null);
        // Se già in play, il caricamento audio è gestito dall'effect su selFreq
        // Se fermo, avvia
        if (!playing) setPlaying(true);
    };

    const selectTrack = (group, idx) => {
        if (!TRACK_GROUPS[group].tracks[idx].free && !isPremium) { setShowUpgrade(true); return; }
        setSelGroup(group);
        setSelTrack(idx);
        setBinMode(null);
        if (!playing) setPlaying(true);
    };

    const selectBinaural = (mode) => {
        if (BINAURAL_RANGES[binRange].premium && !isPremium) { setShowUpgrade(true); return; }
        stopBinaural();
        audioRef.current?.pause();
        setBinMode(mode);
        if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();
        if (!playing) setPlaying(true);
    };

    /* ── Stripe Upgrade ── */
    const handleUpgrade = async (plan) => {
        try {
            if (!auth.currentUser) await auth.signInAnonymously();
            const fn  = functions.httpsCallable('createCheckout');
            const res = await fn({ plan });
            if (res.data?.url) window.location.href = res.data.url;
            else throw new Error('URL checkout non ricevuto');
        } catch (e) {
            console.error(e);
            alert('Errore checkout: ' + e.message);
        }
    };

    /* ── Progress bar ── */
    const seekTo = (e) => {
        if (binMode === 'pure') return;
        const r    = e.currentTarget.getBoundingClientRect();
        const pct  = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        if (audioRef.current) audioRef.current.currentTime = pct * duration;
    };

    /* ── Player labels ── */
    const playerTitle = binMode === 'pure'
        ? `Battimento Binaurale — ${BINAURAL_RANGES[binRange].name}`
        : binMode === 'hybrid'
            ? `${groupData.name} + Binaurale`
            : groupData.name;

    const playerSub = binMode === 'pure'
        ? BINAURAL_RANGES[binRange].desc
        : trackData.name;

    const coverBg = binMode === 'pure'
        ? 'linear-gradient(135deg,#7c3aed,#6366f1)'
        : `linear-gradient(135deg,${freqData.color},#8b5cf6)`;

    const progressW = binMode === 'pure' ? '50%' : `${(curTime / duration) * 100}%`;

    /* ── Render ── */
    return (
        <>
            <audio ref={audioRef} preload="metadata" />

            <div className="app-wrap">

                {/* HEADER */}
                <div className="header fade-in">
                    <h1 className="logo">PUREFREQUENZE</h1>
                    <p className="tagline">Frequenze Solfeggio · Battimenti Binaurali · Benessere</p>
                    <div className="hero-meta">
                        <span className="hero-chip">3 frequenze gratuite</span>
                        <span className="hero-chip">10 tracce incluse</span>
                        <span className="hero-chip">Tutti i binaurali</span>
                    </div>
                </div>

                {/* MAIN GRID */}
                <div className="main-grid">

                    {/* ── PLAYER ── */}
                    <div>
                        <div className="card">
                            {/* Cover */}
                            <div className="cover-art" style={{background: coverBg}}>
                                <svg viewBox="0 0 24 24">
                                    <path d={binMode === 'pure'
                                        ? 'M2 12h4l3-9 4 18 3-9h4'
                                        : groupData.icon
                                    } />
                                </svg>
                            </div>

                            {/* Track info */}
                            <div className="track-info">
                                <div className="freq-badge" style={{
                                    background: binMode === 'pure' ? '#7c3aed' : freqData.color
                                }}>
                                    {binMode === 'pure'
                                        ? `${BINAURAL_RANGES[binRange].freq} Hz`
                                        : `${freqData.hz} Hz`}
                                </div>
                                <h2 className="track-name">{playerTitle}</h2>
                                <p className="track-sub">{playerSub}</p>
                                {binMode && (
                                    <span className="mode-badge">
                                        {binMode === 'pure' ? 'Modalità Binaurale Pura' : 'Modalità Ibrida'}
                                    </span>
                                )}
                            </div>

                            {/* Progress */}
                            <div className="progress-wrap">
                                <div className="progress-bar"
                                    onClick={seekTo}
                                    onTouchMove={e => seekTo(e.touches[0] ? {...e, clientX: e.touches[0].clientX} : e)}
                                >
                                    <div className="progress-fill" style={{
                                        width: progressW,
                                        background: binMode === 'pure'
                                            ? 'linear-gradient(90deg,#7c3aed,#6366f1)'
                                            : `linear-gradient(90deg,${freqData.color},#8b5cf6)`
                                    }} />
                                </div>
                                <div className="time-row">
                                    <span>{binMode === 'pure' ? '∞' : fmt(curTime)}</span>
                                    <span>{binMode === 'pure' ? 'Continuo' : fmt(duration)}</span>
                                </div>
                            </div>

                            {/* Controls main */}
                            <div className="controls-main">
                                <button className="btn-ctrl" onClick={prevTrack}><Icon.Prev /></button>
                                <button className="btn-ctrl btn-play" onClick={() => setPlaying(p => !p)}>
                                    {playing ? <Icon.Pause /> : <Icon.Play />}
                                </button>
                                <button className="btn-ctrl" onClick={nextTrack}><Icon.Next /></button>
                            </div>

                            {/* Controls secondary */}
                            <div className="controls-sec">
                                <button className={`btn-ctrl ${shuffle?'active':''}`} onClick={() => setShuffle(s=>!s)}><Icon.Shuffle /></button>
                                <button className={`btn-ctrl ${repeat ?'active':''}`} onClick={() => setRepeat(r=>!r)}><Icon.Repeat /></button>
                                <button className={`btn-ctrl ${sleepTimer?'active':''}`} onClick={() => setShowTimer(true)}><Icon.Clock /></button>
                                <div className="volume-row">
                                    <button className="btn-ctrl"><Icon.Volume /></button>
                                    <input type="range" className="vol-slider"
                                        min="0" max="1" step="0.01" value={volume}
                                        onChange={e => setVolume(+e.target.value)} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ── TABS ── */}
                    <div>
                        <div className="tabs-nav">
                            {[
                                ['tracks',      'Tracce & Frequenze'],
                                ['applications','Applicazioni'],
                                ['binaural',    'Battimenti Binaurali']
                            ].map(([id, label]) => (
                                <button key={id}
                                    className={`tab-btn ${activeTab===id?'active':''}`}
                                    onClick={() => setActiveTab(id)}>
                                    {label}
                                </button>
                            ))}
                        </div>

                        <div className="tab-pane">

                            {/* ────── TAB TRACCE ────── */}
                            {activeTab === 'tracks' && <>
                                <h3 className="section-title">Seleziona Frequenza Solfeggio</h3>
                                <div className="freq-grid">
                                    {Object.entries(FREQUENCIES).map(([hz, f]) => (
                                        <div key={hz}
                                            className={`freq-item ${!binMode && selFreq==hz ? 'active' : ''} ${f.premium && !isPremium ? 'locked' : ''}`}
                                            style={{'--fc': f.color, '--fc-rgb': f.rgb}}
                                            onClick={() => selectFreq(+hz)}>
                                            <div className="freq-item-top">
                                                <h3 style={{marginBottom:0}}>{f.hz} Hz</h3>
                                                {f.premium
                                                    ? <span className="plan-tag premium"><Icon.Lock /> Premium</span>
                                                    : <span className="plan-tag free">✓ Free</span>
                                                }
                                            </div>
                                            <p>{f.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <h3 className="section-title">Seleziona Traccia</h3>
                                <div className="track-groups">
                                    {Object.entries(TRACK_GROUPS).map(([gId, g]) => (
                                        <div key={gId} className="track-group">
                                            <div className="tg-header">
                                                <svg className="tg-icon" viewBox="0 0 24 24">
                                                    <path d={g.icon} />
                                                </svg>
                                                <h3>{g.name}</h3>
                                            </div>
                                            <div className="track-list">
                                                {g.tracks.map((t, i) => (
                                                    <div key={t.id}
                                                        className={`track-item ${!binMode && selGroup===gId && selTrack===i ? 'active' : ''} ${!t.free && !isPremium ? 'locked' : ''}`}
                                                        onClick={() => selectTrack(gId, i)}>
                                                        <div style={{flex:1}}>
                                                            <h4>{t.name}</h4>
                                                            <p>{t.sub}</p>
                                                        </div>
                                                        <div className="track-item-right">
                                                            {t.free
                                                                ? <span className="plan-tag free">Free</span>
                                                                : <span className="plan-tag premium"><Icon.Lock /> Premium</span>
                                                            }
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>}

                            {/* ────── TAB APPLICAZIONI ────── */}
                            {activeTab === 'applications' && (
                                <div className="app-grid">
                                    {Object.entries(APPLICATIONS).map(([key, app]) => (
                                        <div key={key} className="app-card">
                                            <div className="app-head">
                                                <svg className="app-icon" viewBox="0 0 24 24"><path d={app.icon}/></svg>
                                                <div>
                                                    <h3>{app.title}</h3>
                                                    <p className="app-sub">{app.desc}</p>
                                                </div>
                                            </div>
                                            <div className="obj-list">
                                                {app.objectives.map((obj, i) => (
                                                    <div key={i} className="obj-item">
                                                        <div>
                                                            <h4>{obj.name}</h4>
                                                            <div className="freq-tags">
                                                                {obj.freqs.map(f => (
                                                                    <button key={f} className="freq-tag"
                                                                        style={!isPremium ? {filter:'blur(2px)', opacity:.5, cursor:'not-allowed'} : {}}
                                                                        onClick={() => isPremium ? selectFreq(f) : setShowUpgrade(true)}>
                                                                        {isPremium ? `${f} Hz` : '•••'}
                                                                    </button>
                                                                ))}
                                                                {obj.binaural?.map(b => (
                                                                    <button key={b} className="freq-tag binaural"
                                                                        onClick={() => { setBinRange(b); selectBinaural('hybrid'); }}>
                                                                        {BINAURAL_RANGES[b].name.split(' ')[0]}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* ────── TAB BINAURALI ────── */}
                            {activeTab === 'binaural' && <>
                                <h2 style={{fontSize:'1.8rem', marginBottom:'.8rem'}}>Battimenti Binaurali</h2>
                                <p style={{color:'var(--text-mid)', lineHeight:'1.7', marginBottom:'1.5rem'}}>
                                    Illusioni uditive create dal cervello quando ascolti due toni leggermente diversi — uno per orecchio.
                                    Molti utenti riportano benefici per rilassamento e focus.
                                </p>
                                <div className="binaural-grid">
                                    {[
                                        { mode:'pure',   title:'Modalità Pura',   desc:'Solo battimenti binaurali generati in tempo reale.', feats:['Generazione real-time precisa','Frequenze carrier ottimizzate','Esperienza diretta e immersiva'] },
                                        { mode:'hybrid', title:'Modalità Ibrida', desc:'Battimenti binaurali + Frequenze Solfeggio simultanee.', feats:['Solfeggio + Binaurale combinati','Musica ambient di supporto','Esperienza completa e avvolgente'] }
                                    ].map(({mode, title, desc, feats}) => (
                                        <div key={mode}
                                            className={`binaural-card ${binMode===mode?'active':''}`}
                                            onClick={() => selectBinaural(mode)}>
                                            {mode==='pure' ? <Icon.Wave /> : <svg viewBox="0 0 24 24" style={{width:48,height:48,stroke:'#8b5cf6',fill:'none',strokeWidth:2,marginBottom:'1rem'}}><circle cx="12" cy="12" r="10"/><path d="M2 12h4l3-9 4 18 3-9h4"/></svg>}
                                            <h3>{title}</h3>
                                            <p>{desc}</p>
                                            <ul className="binaural-feats">{feats.map(f=><li key={f}>{f}</li>)}</ul>
                                        </div>
                                    ))}
                                </div>

                                {binMode && (
                                    <div style={{marginTop:'2rem'}}>
                                        <h3 className="section-title">Frequenza Binaurale</h3>
                                        <div className="range-grid">
                                            {Object.entries(BINAURAL_RANGES).map(([key, r]) => (
                                                <button key={key}
                                                    className={`range-btn ${binRange===key?'active':''} ${r.premium&&!isPremium?'locked':''}`}
                                                    onClick={() => {
                                                        setBinRange(key);
                                                        if (playing && binMode) { stopBinaural(); setTimeout(startBinaural, 150); }
                                                    }}>
                                                    <div className="rb-name" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'.4rem'}}>
                                                        {r.name.split('(')[0].trim()}
                                                        {r.premium
                                                            ? <span className="plan-tag premium" style={{fontSize:'.65rem'}}><Icon.Lock /> P</span>
                                                            : <span className="plan-tag free" style={{fontSize:'.65rem'}}>Free</span>
                                                        }
                                                    </div>
                                                    <div className="rb-desc">{r.desc}</div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="warn-box">
                                    <Icon.Warning />
                                    <p><strong>Importante:</strong> I battimenti binaurali funzionano SOLO con cuffie stereo.</p>
                                </div>
                            </>}

                        </div>{/* end tab-pane */}
                    </div>{/* end tabs column */}
                </div>{/* end main-grid */}

                {/* INFO BOXES */}
                <div className="info-box transition">
                    <h4 style={{color:'#c084fc'}}>Transizione tra Frequenze</h4>
                    <p>Al cambio di frequenza potresti percepire una leggera variazione tonale nei primi secondi — è del tutto normale. L'effetto svanisce mentre il sistema uditivo si sincronizza.</p>
                </div>
                <div className="info-box science">
                    <h4 style={{color:'#60a5fa'}}>Nota Scientifica</h4>
                    <p>Le frequenze Solfeggio si basano su tradizioni storiche e ricerca preliminare. I battimenti binaurali mostrano evidenze contrastanti. Gli effetti variano individualmente e non sostituiscono trattamenti medici professionali.</p>
                </div>

            </div>{/* end app-wrap */}

            {/* MODALI */}
            {showUpgrade && (
                <UpgradeModal
                    onClose={() => setShowUpgrade(false)}
                    onUpgrade={handleUpgrade}
                />
            )}

            {showTimer && (
                <TimerModal
                    sleepTimer={sleepTimer}
                    isPremium={isPremium}
                    onSet={(min, locked) => {
                        if (locked) { setShowUpgrade(true); setShowTimer(false); return; }
                        setSleepTimer(min);
                        setShowTimer(false);
                    }}
                    onClose={() => setShowTimer(false)}
                />
            )}
        </>
    );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
